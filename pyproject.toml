[project]
name = "semantic-qa"
version = "0.1.0"
description = "Semantik qidiruvga asoslangan savol-javob tizimi"
authors = [
    {name = "ibrohim",email = "ibrohim.dev.uz@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "qdrant-client (>=1.19.1,<2.0.0)",
    "fastapi (>=0.156.7,<0.157.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
# Yurist-AI bilan bir xil qoidalar + ASYNC (asinxron kodda bloklovchi chaqiruvlar)
select = ["E", "F", "UP", "B", "SIM", "I", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: haqiqiy modelni (1.1 GB) talab qiladi; o'tkazib yuborish: -m \"not slow\""]
